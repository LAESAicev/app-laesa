perguntas:
  - pergunta: 'Preciso cursar Engenharia de Software?'
    resposta: 'Não. Pode se candidatar qualquer estudante de nível técnico ou superior com interesse na área. O que conta é a sua carta e o que você quer construir na liga.'
    ref: 'Art. 52º'
  - pergunta: 'Quantas horas por semana a liga exige?'
    resposta: 'Depende do cronograma de atividades de cada semestre, que é divulgado pela Mesa Diretora. O que o estatuto fixa é a presença mínima de 75% nas reuniões e atividades obrigatórias.'
    ref: 'Art. 11º e 24º'
  - pergunta: 'Recebo certificado?'
    resposta: 'Sim. Membros efetivos recebem 45 horas por semestre, desde que cumpram 75% de frequência, façam as entregas sob sua responsabilidade e participem do Squad em que estão.'
    ref: 'Art. 5º e 26º'
  - pergunta: 'E se eu precisar sair antes do fim do semestre?'
    resposta: 'Você pode sair, e se já tiver cumprido os requisitos mínimos pode pedir o certificado proporcional ao que fez.'
    ref: 'Art. 26º § 4º'
  - pergunta: 'Como fico sabendo do resultado?'
    resposta: 'O resultado sai em até 48 horas depois do fim da seleção. Quem for classificado recebe um e-mail e tem 24 horas para responder aceitando a vaga.'
    ref: 'Art. 57º e 58º'
