# Testa e gera o site a cada push/PR; na main, publica a imagem Docker no GitHub Container Registry e, se desde a
# última versão aprovada só mudou conteúdo do painel, promove a imagem para a tag "aprovada" (ADR 0004).
# Variáveis públicas vêm de "Settings → Secrets and variables → Actions → Variables" (com fallback para
# os valores do .env.example, e um aviso no run enquanto SITE_URL e PUBLIC_CONTACT_EMAIL não estiverem lá).
# O deploy no servidor do iCEV entra quando a hospedagem for definida.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1
  SITE_URL: ${{ vars.SITE_URL || 'https://laesa.icev.edu.br' }}
  PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL || 'laesa@somosicev.com' }}
  PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL || 'https://www.instagram.com/laesa.icev' }}
  PUBLIC_LINKEDIN_URL: ${{ vars.PUBLIC_LINKEDIN_URL || 'https://www.linkedin.com/company/laesaicev' }}
  PUBLIC_GITHUB_URL: ${{ vars.PUBLIC_GITHUB_URL || 'https://github.com/LAESAicev' }}
  # Painel em produção: defina as duas variáveis do repositório (Settings → Variables) quando o GitHub App
  # existir. Vazias, a imagem sai sem painel. As credenciais do App ficam só no .env do servidor.
  PUBLIC_KEYSTATIC_GITHUB_REPO: ${{ vars.PUBLIC_KEYSTATIC_GITHUB_REPO }}
  PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}

jobs:
  teste:
    name: Checagem, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (astro check)
        run: npx astro check
      - name: Testes
        run: npx vitest run
        env:
          INSCRICAO_SECRET: segredo-de-teste-com-mais-de-32-caracteres
      - name: Build
        run: npx astro build
      # O comando dos avisos roda TypeScript direto no Node (a imagem leva src/lib): import quebrado ou sintaxe
      # que o Node não sabe apagar falha aqui, e não só no servidor. Banco temporário, sem SMTP.
      - name: Comando dos avisos
        run: node scripts/avisar.ts itens --manifesto dist/client/avisos/itens.json
        env:
          INSCRICAO_SECRET: segredo-de-teste-com-mais-de-32-caracteres
          INSCRITOS_DB: ${{ runner.temp }}/avisos.db
      # Sobe o servidor gerado (sem SMTP), confere rotas e procura script inline e links quebrados no HTML
      - name: Smoke test
        run: node scripts/smoke.mjs

  imagem:
    name: Imagem Docker
    needs: teste
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Domínio ainda indefinido: publica com o fallback, mas deixa um aviso visível no run.
      # Para tornar obrigatório: ::error no lugar de ::warning, seguido de "exit 1" (docs/operacao.md).
      - name: Confere variáveis do GitHub
        env:
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
        run: |
          [ -n "$VAR_SITE_URL" ] || echo "::warning title=SITE_URL não definido::Imagem gerada com o fallback $SITE_URL. Defina SITE_URL em Settings → Secrets and variables → Actions → Variables."
          [ -n "$VAR_CONTACT_EMAIL" ] || echo "::warning title=PUBLIC_CONTACT_EMAIL não definido::Imagem gerada com o fallback $PUBLIC_CONTACT_EMAIL. Defina PUBLIC_CONTACT_EMAIL nas Variables do repositório."
      - id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            PUBLIC_CONTACT_EMAIL=${{ env.PUBLIC_CONTACT_EMAIL }}
            PUBLIC_INSTAGRAM_URL=${{ env.PUBLIC_INSTAGRAM_URL }}
            PUBLIC_LINKEDIN_URL=${{ env.PUBLIC_LINKEDIN_URL }}
            PUBLIC_GITHUB_URL=${{ env.PUBLIC_GITHUB_URL }}
            PUBLIC_KEYSTATIC_GITHUB_REPO=${{ env.PUBLIC_KEYSTATIC_GITHUB_REPO }}
            PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=${{ env.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
            TRUST_PROXY=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # O servidor segue a tag "aprovada" (ADR 0004). Este job a move para a imagem nova só quando, desde a última
  # versão aprovada, mudou apenas conteúdo do painel. Mudou código: fica para o workflow "Promover para produção".
  # A versão aprovada é lida da própria imagem (anotação no GHCR), não de uma tag do git: o token de um editor
  # do painel consegue mover tags do git, mas não publicar no GHCR.
  promover:
    name: Promover se for só conteúdo
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promocao-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # o diff é contra a última versão aprovada, que pode estar vários commits atrás
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Saída "sim" só se tudo der certo; qualquer dúvida (sem versão aprovada, script ausente) não promove.
      # A regra (scripts/so-conteudo.mjs) vem do commit APROVADO, não do novo: um commit não decide sobre si mesmo.
      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}"
          nao_promove() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=Não promovida::$1"; exit 0; }

          aprovado=$(docker buildx imagetools inspect --raw "$imagem:aprovada" 2>/dev/null \
            | jq -r '.annotations["org.opencontainers.image.revision"] // empty') || aprovado=""
          if ! [[ "$aprovado" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$aprovado^{commit}" 2>/dev/null; then
            nao_promove "Ainda não há versão aprovada (ou ela não está na história da main): a primeira promoção é manual, pelo workflow \"Promover para produção\"."
          fi
          git show "$aprovado:scripts/so-conteudo.mjs" > "$RUNNER_TEMP/so-conteudo.mjs" 2>/dev/null \
            || nao_promove "A versão aprovada ($aprovado) não tem scripts/so-conteudo.mjs: promova à mão."

          set +e
          git diff --raw -z --no-renames "$aprovado" "$GITHUB_SHA" | node "$RUNNER_TEMP/so-conteudo.mjs" > "$RUNNER_TEMP/recusados.txt"
          decisao=$?
          set -e
          case "$decisao" in
            0) echo "promover=sim" >> "$GITHUB_OUTPUT" ;;
            2) nao_promove "Nada mudou desde a versão aprovada ($aprovado)." ;;
            1)
              {
                echo "### Há mudança de código desde a última versão aprovada: promova à mão"
                echo
                echo "Versão aprovada: \`$aprovado\`. Arquivos fora do conteúdo do painel (até 50):"
                echo
                echo '```text'
                head -n 50 "$RUNNER_TEMP/recusados.txt"
                echo '```'
                echo
                echo "Revise o diff e rode o workflow \"Promover para produção\" (docs/operacao.md)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Não promovida::Há mudança de código desde a última versão aprovada: promova à mão." ;;
            *) echo "::error::Falha ao comparar com a versão aprovada ($aprovado)."; exit 1 ;;
          esac
      - name: Promove (só conteúdo)
        if: steps.decide.outputs.promover == 'sim'
        run: |
          set -euo pipefail
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Sem rebuild: um índice novo com os mesmos manifestos da imagem deste commit, anotado com o SHA.
          docker buildx imagetools create --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$imagem:aprovada" "$imagem:$GITHUB_SHA"
          lido=$(docker buildx imagetools inspect --raw "$imagem:aprovada" | jq -r '.annotations["org.opencontainers.image.revision"] // empty')
          [ "$lido" = "$GITHUB_SHA" ] || { echo "::error::A tag aprovada não ficou com $GITHUB_SHA (lido: $lido)."; exit 1; }
          echo "Promovida: \`$imagem:aprovada\` = \`$GITHUB_SHA\` (só conteúdo desde a versão anterior)." >> "$GITHUB_STEP_SUMMARY"

  # deploy: o servidor roda `docker compose pull && docker compose up -d` por cron e pega a tag "aprovada".
  # Ver docs/operacao.md (Atualizar sozinho ou à mão).
