# Promove à mão uma versão para produção: move a tag "aprovada" da imagem, que o servidor segue (ADR 0004).
# Use depois de revisar o diff de uma mudança de código. Serve também para voltar a uma versão anterior.
# O environment "producao" exige aprovação de um revisor; ele é configurado na interface do GitHub
# (Settings → Environments), passo a passo em docs/operacao.md.
name: Promover para produção

on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo (40 caracteres) de um commit da main com o CI verde. Vazio = o último commit da main.
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  conferir:
    name: Confere o commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          SHA: ${{ inputs.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${SHA,,}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Use o SHA completo do commit (40 caracteres)."; exit 1; }
          # CI verde de um push na main (testes, build, smoke e imagem publicada)
          verdes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=success" --jq .total_count)
          [ "$verdes" -gt 0 ] || { echo "::error::O commit $SHA não tem CI verde de um push na main. Se o run foi cancelado por um push mais novo, promova o commit mais novo."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  promover:
    name: Promove
    needs: conferir
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: promocao-producao
      cancel-in-progress: false
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move a tag aprovada
        env:
          SHA: ${{ needs.conferir.outputs.sha }}
        run: |
          set -euo pipefail
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$imagem:$SHA" > /dev/null || { echo "::error::A imagem $imagem:$SHA não existe."; exit 1; }
          # Sem rebuild: um índice novo com os mesmos manifestos, anotado com o SHA (o CI lê dali a versão aprovada).
          docker buildx imagetools create --annotation "index:org.opencontainers.image.revision=$SHA" \
            --tag "$imagem:aprovada" "$imagem:$SHA"
          lido=$(docker buildx imagetools inspect --raw "$imagem:aprovada" | jq -r '.annotations["org.opencontainers.image.revision"] // empty')
          [ "$lido" = "$SHA" ] || { echo "::error::A tag aprovada não ficou com $SHA (lido: $lido)."; exit 1; }
          echo "Promovida: \`$imagem:aprovada\` = \`$SHA\`. O servidor pega na próxima atualização (cron ou à mão)." >> "$GITHUB_STEP_SUMMARY"
