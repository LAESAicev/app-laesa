# Atualizações de dependências: um PR por semana e por ecossistema, com as versões menores agrupadas.
# Versões maiores (major) vêm em PRs separados, para revisar com calma. Nada é aplicado sem merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Dockerfile (node:24-slim) e compose.yaml (caddy:2.10-alpine), fixados por digest
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
